    points="5,7 59,7 32,54"
    fill="#1a0d00"
    fill-opacity="0.92"
    stroke="#c88010"
    stroke-width="2.8"
    stroke-linejoin="round"
  />
  <!-- Inner triangle — top left, vertex down -->
  <polygon
    points="10.5,11.8 28.5,11.8 19.5,27.4"
    fill="none"
    stroke="#f0c030"
    stroke-width="1.9"
