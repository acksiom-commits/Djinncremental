  />
  <!-- Inner triangle — top right, vertex down -->
  <polygon
    points="35.5,11.8 53.5,11.8 44.5,27.4"
    fill="none"
    stroke="#f0c030"
    stroke-width="1.9"
    stroke-linejoin="round"
  />
  <!-- Inner triangle — bottom centre, vertex down -->
  <polygon
    points="23,32.8 41,32.8 32,48.4"
    fill="none"
    stroke="#f0c030"
    stroke-width="1.9"
    stroke-linejoin="round"
  />
